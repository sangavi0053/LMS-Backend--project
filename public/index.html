<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LMS Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0f1e;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bg-animation {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .bg-animation span {
      position: absolute;
      display: block;
      border-radius: 50%;
      background: rgba(0, 122, 255, 0.12);
      animation: animate 25s linear infinite;
      bottom: -150px;
    }

    .bg-animation span:nth-child(1)  { left: 25%; width: 80px;  height: 80px;  animation-delay: 0s; }
    .bg-animation span:nth-child(2)  { left: 10%; width: 20px;  height: 20px;  animation-delay: 2s;  animation-duration: 12s; }
    .bg-animation span:nth-child(3)  { left: 70%; width: 20px;  height: 20px;  animation-delay: 4s; }
    .bg-animation span:nth-child(4)  { left: 40%; width: 60px;  height: 60px;  animation-delay: 0s;  animation-duration: 18s; }
    .bg-animation span:nth-child(5)  { left: 65%; width: 20px;  height: 20px;  animation-delay: 0s; }
    .bg-animation span:nth-child(6)  { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
    .bg-animation span:nth-child(7)  { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
    .bg-animation span:nth-child(8)  { left: 50%; width: 25px;  height: 25px;  animation-delay: 15s; animation-duration: 45s; }
    .bg-animation span:nth-child(9)  { left: 20%; width: 15px;  height: 15px;  animation-delay: 2s;  animation-duration: 35s; }
    .bg-animation span:nth-child(10) { left: 85%; width: 150px; height: 150px; animation-delay: 0s;  animation-duration: 11s; }

    @keyframes animate {
      0%   { transform: translateY(0) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
    }

    .hero {
      position: relative;
      z-index: 1;
      text-align: center;
      animation: fadeUp 1s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      background: rgba(0,122,255,0.2);
      border: 1px solid rgba(0,122,255,0.4);
      color: #007aff;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    .hero h1 {
      font-size: 52px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .hero h1 span {
      background: linear-gradient(135deg, #007aff, #00c6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: #aaa;
      font-size: 17px;
      margin-bottom: 40px;
      max-width: 480px;
      line-height: 1.7;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      padding: 14px 35px;
      background: linear-gradient(135deg, #007aff, #0055cc);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s;
      letter-spacing: 0.5px;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0,122,255,0.4);
    }

    .btn-secondary {
      padding: 14px 35px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s;
    }

    .btn-secondary:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.3);
    }

    .features {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 20px;
      margin-top: 60px;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeUp 1.2s ease;
    }

    .feature-item {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #aaa;
    }

    .feature-item span { font-size: 20px; }

    .footer {
      position: fixed;
      bottom: 20px;
      color: #444;
      font-size: 12px;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="bg-animation">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="hero">
    <div class="badge">🎓 Learning Management System</div>
    <h1>Welcome to <span>LMS Portal</span></h1>
    <p>Your complete platform for managing and accessing courses. Learn smarter, teach better.</p>
    <div class="btn-group">
      <a href="login.html" class="btn-primary">🚀 Get Started</a>
      <a href="register.html" class="btn-secondary">✨ Register</a>
    </div>
  </div>

  <div class="features">
    <div class="feature-item"><span>📚</span> Course Management</div>
    <div class="feature-item"><span>🔐</span> Secure Login</div>
    <div class="feature-item"><span>🛠️</span> Admin Controls</div>
    <div class="feature-item"><span>⚡</span> Real-time Updates</div>
  </div>

  <div class="footer">Created by Sangavi</div>

</body>
</html>
